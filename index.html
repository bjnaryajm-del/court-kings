<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Court Kings - Basketball Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main App Container -->
    <div id="court-kings-app">
        
        <!-- HEADER -->
        <header class="game-header">
            <div class="header-logo">
                <h1>Court Kings 👑</h1>
                <p>Build your dynasty. Dominate the court.</p>
            </div>
            <nav class="header-nav">
                <button id="nav-roster" class="nav-btn active">Roster</button>
                <button id="nav-sim" class="nav-btn">Play</button>
                <button id="nav-trade" class="nav-btn">Trade Block</button>
            </nav>
        </header>

        <!-- TOP BAR: CURRENCY & DRAFT ACTIONS -->
        <div class="dashboard-controls">
            <div class="stats-panel">
                <div class="stat-box">
                    <span class="stat-label">Franchise Funds</span>
                    <span id="coin-display" class="stat-value text-gold">1000 🪙</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Team OVR</span>
                    <span id="team-ovr-display" class="stat-value">0</span>
                </div>
            </div>
            <div class="draft-panel">
                <button id="roll-btn" class="action-btn primary-btn">Draft Player (100 🪙)</button>
            </div>
        </div>

        <!-- DRAFT REVEAL AREA -->
        <div id="player-reveal-container" class="hidden">
            <div class="reveal-content">
                <h2 id="player-reveal-text">Scouting prospects...</h2>
                <div id="player-reveal-card" class="player-card hidden">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>

        <!-- MAIN WORKSPACE -->
        <main class="game-workspace">
            
            <!-- VIEW: ROSTER MANAGEMENT -->
            <section id="view-roster" class="workspace-view active-view">
                <div class="section-header">
                    <h2>Active Roster</h2>
                    <div class="roster-filters">
                        <select id="filter-pos">
                            <option value="ALL">All Positions</option>
                            <option value="PG">Point Guards</option>
                            <option value="SG">Shooting Guards</option>
                            <option value="SF">Small Forwards</option>
                            <option value="PF">Power Forwards</option>
                            <option value="C">Centers</option>
                        </select>
                    </div>
                </div>
                <div class="roster-grid" id="roster-container">
                    <div class="empty-state">
                        <p>Your roster is empty. Hit the Draft button to sign your first player.</p>
                    </div>
                    <!-- Player Cards inserted here -->
                </div>
            </section>

            <!-- VIEW: SIMULATION ENGINE -->
            <section id="view-sim" class="workspace-view hidden">
                <div class="sim-layout">
                    <!-- Matchup Setup -->
                    <div class="matchup-panel">
                        <h2>Next Game</h2>
                        <div class="opponent-selector">
                            <label for="opponent-select">Select Opponent:</label>
                            <select id="opponent-select">
                                <!-- Populated by JS Data Seed -->
                            </select>
                        </div>
                        <div class="matchup-preview">
                            <div class="team-preview user-preview">
                                <h3>Your Team</h3>
                                <span id="preview-user-ovr" class="preview-ovr">0 OVR</span>
                            </div>
                            <div class="vs-badge">VS</div>
                            <div class="team-preview opp-preview">
                                <h3 id="preview-opp-name">Select Team</h3>
                                <span id="preview-opp-ovr" class="preview-ovr">0 OVR</span>
                            </div>
                        </div>
                        <button id="sim-game-btn" class="action-btn sim-btn" disabled>Simulate Match</button>
                    </div>

                    <!-- Live Play-by-Play -->
                    <div class="simulation-panel">
                        <div class="scoreboard">
                            <div class="score-box">
                                <span class="team-name">USER</span>
                                <span id="home-score" class="score-num">0</span>
                            </div>
                            <div class="game-clock" id="game-clock">Q1 12:00</div>
                            <div class="score-box">
                                <span class="team-name">OPP</span>
                                <span id="away-score" class="score-num">0</span>
                            </div>
                        </div>
                        <div class="ticker-container">
                            <ul id="play-by-play-log">
                                <li class="log-event system-msg">Awaiting tip-off...</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </section>

        </main>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
